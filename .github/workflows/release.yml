name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifact
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE_FORMAT: ${{ matrix.archive }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p dist
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          binary_name="openilink-tg"
          if [ "${GOOS}" = "windows" ]; then
            binary_name="${binary_name}.exe"
          fi

          artifact_dir="dist/openilink-tg_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "${artifact_dir}"

          CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
            go build \
              -trimpath \
              -ldflags="-s -w -X openilink-tg/internal/version.Version=${VERSION} -X openilink-tg/internal/version.Commit=${COMMIT} -X openilink-tg/internal/version.BuildDate=${build_date}" \
              -o "${artifact_dir}/${binary_name}" \
              ./cmd/openilink-tg

          cp README.md "${artifact_dir}/README.md"

          if [ "${ARCHIVE_FORMAT}" = "zip" ]; then
            cd dist
            zip -r "openilink-tg_${VERSION}_${GOOS}_${GOARCH}.zip" "$(basename "${artifact_dir}")"
            cd ..
          else
            tar -C dist -czf "dist/openilink-tg_${VERSION}_${GOOS}_${GOARCH}.tar.gz" "$(basename "${artifact_dir}")"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "${TAG_NAME}" artifacts/* --title "${TAG_NAME}" --generate-notes
